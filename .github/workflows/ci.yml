name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.7"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
        continue-on-error: true
