name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md"]
  pull_request:
    paths: ["docs/**", "README.md"]

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            docs/**/*.md
